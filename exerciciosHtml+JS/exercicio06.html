<!--
6. Crie uma página que receba uma lista de nomes e exiba o nome mais longo e o mais curto.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 6</title>
</head>
<body>
    <form>
        <label for="nomes">Digite o nome a ser inserido na lista:</label>
        <input type="text" name="nome" id="nome">
        <button type="button" onclick="adicionarNome()">Enviar</button>
    </form>
    <div id="container-nomes"></div>
    <button type="button" onclick="compararNomes()">Comparar</button>
    <p id="nome-curto"></p>
    <p id="nome-longo"></p>
    <p></p>
    <script src="./exercicio06.js"></script>
</body>
</html>
